    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              app: {
                bg: '#0F1115', // Deep Void
                surface: '#181B21', // Cell Wall
                border: '#272B36', // Membrane
                primary: '#6366F1', // Energy
                secondary: '#8B5CF6', // Synapse
                success: '#10B981', 
                danger: '#EF4444', 
                warning: '#F59E0B',
                text: '#F3F4F6',
                muted: '#9CA3AF',
              }
            },
            animation: {
              'pulse-slow': 'pulse 8s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0F1115;
        color: #F3F4F6;
        overflow: hidden;
      }
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #272B36; 
        border-radius: 2px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #6366F1;
