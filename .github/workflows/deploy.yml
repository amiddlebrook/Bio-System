name: Cloudflare production deployment
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bio-system-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --test tests/*.test.mjs
      - run: npm run build
      - name: Prepare D1 binding
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: node scripts/prepare-config.mjs
      - name: Apply database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.45.0 d1 migrations apply DB --remote --config wrangler.deploy.json
      - name: Deploy Worker with frontend assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.45.0 deploy --config wrangler.deploy.json
      - name: Set private access secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BIO_SYSTEM_ACCESS_TOKEN: ${{ secrets.BIO_SYSTEM_ACCESS_TOKEN }}
        run: |
          if [ -z "$BIO_SYSTEM_ACCESS_TOKEN" ]; then
            echo "::error::Set BIO_SYSTEM_ACCESS_TOKEN in GitHub Actions secrets"
            exit 1
          fi
          printf '%s' "$BIO_SYSTEM_ACCESS_TOKEN" | npx --yes wrangler@4.45.0 secret put APP_ACCESS_TOKEN --config wrangler.deploy.json
